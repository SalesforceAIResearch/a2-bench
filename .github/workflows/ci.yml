name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev

      # Critical errors only (syntax errors, undefined names). The full rule
      # set doesn't pass yet; tighten once the backlog is cleared.
      - name: Lint
        run: uv run ruff check --select E9,F63,F7,F82 .

      - name: Import check
        run: uv run python -c "import a2_run, tasks.task_spec, metrics"
