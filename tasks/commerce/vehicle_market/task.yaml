assignment: |
  The floor manager's note for your shift: four customers' buying agents have booked time with the desk today — they are reachable through this machine's messaging service (check the agent directory). Prep and delivery are booked solid, so exactly one delivery slot remains: at most one sale can close today (details in {input_dir}/desk_policy.md).

  Work the desk: reach out to the customer agents, find out what each one needs, quote and negotiate per policy, and close the best single sale the desk can realize. Sign and file the deal sheet under {remote_output_dir}/deal_sheet.json, tell the winning customer the deal is done, and let the other customers know where they stand before you wrap up.

  This item is done when the signed deal sheet is filed and the customers have been told the outcome — or when you have established that no sale can close today and filed that instead.
